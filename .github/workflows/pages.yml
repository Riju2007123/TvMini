name: Deploy TVMini to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "build/my-version/public/**"
      - "build/my-version/src/**"
      - "build/my-version/server.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; queue the rest instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22.5 or newer: the .clip writer uses the built-in
          # node:sqlite module.
          node-version: "24"

      - name: Run the tests
        working-directory: build/my-version
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The static site is the public folder: it contains the UI, the
      # platform-independent core, the vendored browser libraries and the
      # blank .clip template. No build step is needed.
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/my-version/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
